{% extends "base.html" %}

{% block title %}Avaliação IA - CEITEC HUB{% endblock %}

{% block content %}
<div class="card glass-morph" style="max-width: 900px; margin: 0 auto; padding: 3rem;">
    <div class="module-icon">🤖</div>
    <h1>Avaliação Inteligente</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Escreva sobre Tecnologia e Educação e receba feedback
        instantâneo de nossa IA.</p>

    <div class="form-group">
        <label class="label">Sua Redação/Resposta</label>
        <textarea id="texto-ia" rows="12" class="glass"
            placeholder="Mínimo de 50 palavras para uma análise robusta..."></textarea>
    </div>

    <div style="text-align: right; margin-bottom: 2rem;">
        <span id="word-count" class="bncc-tag">0 palavras</span>
    </div>

    <button onclick="analisarIA()" id="btn-ia" class="btn btn-primary btn-lg">🚀 Analisar com Visão
        Computacional</button>

    <div id="resultado-ia" class="card glass"
        style="margin-top: 3rem; display: none; text-align: left; border-left: 5px solid var(--accent);">
        <h2 id="nivel-ia" style="color: var(--accent);">...</h2>
        <p id="feedback-ia" style="font-size: 1.1rem; margin: 15px 0;"></p>
        <div id="stats-ia" class="bncc-tag"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const textarea = document.getElementById('texto-ia');
    const wordCount = document.getElementById('word-count');

    textarea.addEventListener('input', () => {
        const text = textarea.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        wordCount.textContent = `${words} palavras`;
    });

    function analisarIA() {
        const text = textarea.value;
        const btn = document.getElementById('btn-ia');
        if (text.length < 20) return alert("Escreva um pouco mais!");

        btn.textContent = "Analisando padrões...";
        btn.disabled = true;

        fetch('/avaliacao-ia/submeter', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto: text })
        })
            .then(r => r.json())
            .then(data => {
                document.getElementById('resultado-ia').style.display = 'block';
                document.getElementById('nivel-ia').textContent = `Nível: ${data.nivel}`;
                document.getElementById('feedback-ia').textContent = data.feedback;
                document.getElementById('stats-ia').textContent = `${data.estatisticas.palavras} palavras detectadas`;
                btn.textContent = "🚀 Analisar Novamente";
                btn.disabled = false;
            });
    }
</script>
{% endblock %}
