{% extends "base.html" %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="auth-card glass-morph" style="width: 100%; max-width: 450px;">
        <div class="auth-header">
            <div class="logo-orb" style="margin: 0 auto 1.5rem;">🚀</div>
            <h1>CEITEC HUB</h1>
            <p>Conectando Tecnologia e Educação</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="label">Nome de usuário</label>
                <input type="text" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label class="label">Senha</label>
                <input type="password" name="senha" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Entrar no
                Portal</button>
        </form>

        <div style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
            Não tem uma conta? <a href="{{ url_for('register') }}"
                style="color: var(--primary); font-weight: 600;">Cadastre-se</a>
        </div>
    </div>
</div>
{% endblock %}
